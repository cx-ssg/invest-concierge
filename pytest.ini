[pytest]
testpaths = tests
# 2026-10-01 (8th external audit, Codex F3): was `addopts = -q`; combined with the CLI `-q` it became
# `-qq`, which swallows the summary line -- so the documented command could not print "N passed"
# and no pass-count claim was self-verifiable.
# !! KEEP THIS FILE ASCII-ONLY !! iniconfig reads it with the system ANSI codec (GBK here);
# non-ASCII bytes crash the whole pytest run (measured 2026-10-01: UnicodeDecodeError 0xac).
addopts = -ra
