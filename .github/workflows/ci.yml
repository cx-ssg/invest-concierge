name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: python -m pytest -q

  # A-R1 F1（2026-10-03）：BUG-001 的修复此前**没有任何自动化回归** —— 把它改回缺陷版，
  # 上面那个 job 仍 476 全绿。本 job 用 jsdom 跑**真 ChatArea 组件 bundle + 桩 SSE**，
  # 不需要浏览器、不需要 LLM/Key、不需要 Ollama、不需要后端。
  # 最后一步是 harness 自检：缺陷版变异体必须被断言抓住（否则等于没测）。
  frontend-dom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: A2/B1 offline DOM regression (F1 BUG-001 / BUG-002 会话归属 / F2 编号 / F3 代码块 / F5 scheme / B1 判官标注)
        run: node scripts/verify_a2_dom.mjs

      # BUG-002（A-R2）：加两个变异体 ——
      #   ① bug002         = 关掉「采纳服务端新会话 id」（修复前的行为）
      #   ② bug002-partial = 只回写 activeId、不同步 live.sessionId（"照 claude 建议只加一行"的版本，
      #      done 当帧回答视图被门控卸载 ⇒ BUG-001 复发；证明两行缺一不可）
      # B1（2026-10-03）：③ judge-uncertain-as-relevant = 把「未确认」也渲染成「相关」
      #   （= 把不可信结果伪装成 relevant 的缺陷版；判官的核心安全性质）
      - name: A2/B1 DOM harness self-check (mutants must be caught)
        run: |
          node scripts/verify_a2_dom.mjs --mutate bug001
          node scripts/verify_a2_dom.mjs --mutate bug002
          node scripts/verify_a2_dom.mjs --mutate bug002-partial
          node scripts/verify_a2_dom.mjs --mutate judge-uncertain-as-relevant
